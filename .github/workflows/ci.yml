name: Check Circles
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Credential-free build validation only; deployment uses its own environment.
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run seed:check
      - run: npm run build
